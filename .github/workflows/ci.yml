name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Backend and workflow tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/pom.xml
      - name: Verify backend and integration contracts
        run: sh ./mvnw --batch-mode --no-transfer-progress -Pintegration '-Dit.test=Frontend*ApiIT,TaskDependenciesIT,TaskDependencyCancellationIT,TaskExecutionAccessIT,TaskAssignmentRulesIT' verify

  frontend:
    name: Frontend checks and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: client
    env:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8080
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci --ignore-scripts --no-audit --fund=false
      - run: npm run lint
      - run: npm run lint:fsd
      - run: npm run typecheck
      - run: npm run build
