# Локальное окружение разработчика: инфраструктура, backend и client.
#
# Параметры и порты на хосте — в backend/.env (образец — .env.example).
# Порт занят — правится соответствующий *_HOST_PORT в .env, этот файл не трогается.
# Команды запуска, сброса базы и сида — в README.md в корне репозитория.

name: ${COMPOSE_PROJECT_NAME:?COMPOSE_PROJECT_NAME is required}

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      TZ: UTC
    ports:
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      - --appendonly
      - "yes"
      - --appendfsync
      - always
      - --maxmemory-policy
      - noeviction
    ports:
      - "${REDIS_HOST_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:?REDIS_PASSWORD is required}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  rabbitmq:
    image: rabbitmq:4-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USERNAME:?RABBITMQ_USERNAME is required}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD is required}
    ports:
      - "${RABBITMQ_HOST_PORT:-5672}:5672"
      - "${RABBITMQ_MANAGEMENT_HOST_PORT:-15672}:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD-SHELL", "su-exec rabbitmq rabbitmq-diagnostics -q ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  minio:
    image: minio/minio:RELEASE.2025-07-23T15-54-02Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:?MINIO_ACCESS_KEY is required}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:?MINIO_SECRET_KEY is required}
    ports:
      - "${MINIO_API_HOST_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_HOST_PORT:-9001}:9001"
    volumes:
      - minio_data:/data

  mailpit:
    image: axllent/mailpit:v1.27.4
    ports:
      - "127.0.0.1:${MAILPIT_HOST_PORT:-8025}:8025"

  app:
    build:
      context: .
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:?SPRING_PROFILES_ACTIVE is required}
      LOG_LEVEL: ${LOG_LEVEL:-DEBUG}
      EXTERNAL_INTEGRATIONS_MODE: ${EXTERNAL_INTEGRATIONS_MODE:-live}
      DB_URL: ${DB_URL:?DB_URL is required}
      DB_USERNAME: ${DB_USERNAME:?DB_USERNAME is required}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      REDIS_HOST: ${REDIS_HOST:?REDIS_HOST is required}
      REDIS_PORT: ${REDIS_PORT:?REDIS_PORT is required}
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      RABBITMQ_HOST: ${RABBITMQ_HOST:?RABBITMQ_HOST is required}
      RABBITMQ_PORT: ${RABBITMQ_PORT:?RABBITMQ_PORT is required}
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME:?RABBITMQ_USERNAME is required}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD is required}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:?MINIO_ENDPOINT is required}
      MINIO_PUBLIC_ENDPOINT: ${MINIO_PUBLIC_ENDPOINT:-http://localhost:${MINIO_API_HOST_PORT:-9000}}
      MINIO_REGION: ${MINIO_REGION:-us-east-1}
      FILE_BUCKET: ${FILE_BUCKET:-workflow-files}
      TASK_FILE_BUCKET: ${TASK_FILE_BUCKET:-workflow-task-files}
      FILE_MAX_SIZE_BYTES: ${FILE_MAX_SIZE_BYTES:-20971520}
      FILE_ALLOWED_EXTENSIONS: ${FILE_ALLOWED_EXTENSIONS:-jpg,png,heic,pdf,docx,xlsx,dwg}
      FILE_LINK_TTL: ${FILE_LINK_TTL:-5m}
      FILE_UPLOAD_CLEANUP_ENABLED: ${FILE_UPLOAD_CLEANUP_ENABLED:-true}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:?MINIO_ACCESS_KEY is required}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:?MINIO_SECRET_KEY is required}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      OBJECT_LIST_CURSOR_SECRET: ${OBJECT_LIST_CURSOR_SECRET:-${JWT_SECRET}}
      JWT_ISSUER: ${JWT_ISSUER:-workflow-crm}
      JWT_COOKIE_NAME: ${JWT_COOKIE_NAME:-workflow_access_token}
      JWT_ACCESS_TOKEN_TTL: ${JWT_ACCESS_TOKEN_TTL:-15m}
      JWT_REFRESH_COOKIE_NAME: ${JWT_REFRESH_COOKIE_NAME:-workflow_refresh_token}
      JWT_REFRESH_TOKEN_TTL: ${JWT_REFRESH_TOKEN_TTL:-7d}
      REFRESH_SESSION_ABSOLUTE_TTL: ${REFRESH_SESSION_ABSOLUTE_TTL:-30d}
      REFRESH_REUSE_GRACE_PERIOD: ${REFRESH_REUSE_GRACE_PERIOD:-30s}
      JWT_COOKIE_SECURE: ${JWT_COOKIE_SECURE:-true}
      LOGIN_MAX_ATTEMPTS: ${LOGIN_MAX_ATTEMPTS:-5}
      LOGIN_LOCK_DURATION: ${LOGIN_LOCK_DURATION:-15m}
      ADMIN_SECURITY_MAX_ACTIONS: ${ADMIN_SECURITY_MAX_ACTIONS:-10}
      ADMIN_SECURITY_RATE_WINDOW: ${ADMIN_SECURITY_RATE_WINDOW:-1m}
      DEVICE_TRUST_DURATION: ${DEVICE_TRUST_DURATION:-30d}
      DEVICE_CONFIRMATION_MODE: ${DEVICE_CONFIRMATION_MODE:-NEW_DEVICE}
      DEVICE_COOKIE_NAME: ${DEVICE_COOKIE_NAME:-workflow_device}
      AUTH_CHALLENGE_TTL: ${AUTH_CHALLENGE_TTL:-5m}
      AUTH_EMAIL_CODE_MAX_ATTEMPTS: ${AUTH_EMAIL_CODE_MAX_ATTEMPTS:-5}
      TELEGRAM_BOT_USERNAME: ${TELEGRAM_BOT_USERNAME:-}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_WEBHOOK_SECRET: ${TELEGRAM_WEBHOOK_SECRET:-}
      GEOCODING_URL: ${GEOCODING_URL:-https://nominatim.openstreetmap.org/reverse}
      GEOCODING_SEARCH_URL: ${GEOCODING_SEARCH_URL:-}
      OBJECT_DUPLICATE_RADIUS_METRES: ${OBJECT_DUPLICATE_RADIUS_METRES:-50}
      OBJECT_DUPLICATE_NAME_SIMILARITY: ${OBJECT_DUPLICATE_NAME_SIMILARITY:-0.6}
      OBJECT_EXPORT_WORKER_ENABLED: ${OBJECT_EXPORT_WORKER_ENABLED:-true}
      OBJECT_EXPORT_POLL_DELAY_MS: ${OBJECT_EXPORT_POLL_DELAY_MS:-1000}
      OBJECT_EXPORT_BUCKET: ${OBJECT_EXPORT_BUCKET:-workflow-exports}
      OBJECT_EXPORT_RETENTION: ${OBJECT_EXPORT_RETENTION:-24h}
      OBJECT_EXPORT_LINK_TTL: ${OBJECT_EXPORT_LINK_TTL:-5m}
      OBJECT_EXPORT_MAX_FILE_BYTES: ${OBJECT_EXPORT_MAX_FILE_BYTES:-268435456}
      OBJECT_DELETION_WORKER_ENABLED: ${OBJECT_DELETION_WORKER_ENABLED:-true}
      OBJECT_DELETION_POLL_DELAY_MS: ${OBJECT_DELETION_POLL_DELAY_MS:-5000}
      GEOCODING_USER_AGENT: ${GEOCODING_USER_AGENT:-WorkflowCRM/0.1 (https://github.com/DrBarga/workflow-crm)}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_AUTH: ${SMTP_AUTH:-true}
      SMTP_STARTTLS_ENABLED: ${SMTP_STARTTLS_ENABLED:-true}
      SMTP_SSL_ENABLED: ${SMTP_SSL_ENABLED:-false}
      AUTH_EMAIL_FROM: ${AUTH_EMAIL_FROM:-}
      SEED_TEST_USER_EMAIL: ${SEED_TEST_USER_EMAIL:-}
      SEED_TEST_USER_PASSWORD: ${SEED_TEST_USER_PASSWORD:-}
      PASSWORD_RESET_TTL: ${PASSWORD_RESET_TTL:-30m}
      PASSWORD_RESET_URL: ${PASSWORD_RESET_URL:-}
      PASSWORD_RESET_MAIL_FROM: ${PASSWORD_RESET_MAIL_FROM:-${AUTH_EMAIL_FROM:-}}
      USER_REGION_REQUIRED_ROLES: ${USER_REGION_REQUIRED_ROLES:-MANAGER,REGIONAL_MANAGER,CONTRACT_MANAGER}
      USER_INVITATION_TTL: ${USER_INVITATION_TTL:-72h}
      USER_INVITATION_URL: ${USER_INVITATION_URL:-}
      USER_INVITATION_MAIL_FROM: ${USER_INVITATION_MAIL_FROM:-${AUTH_EMAIL_FROM:-}}
      # Клиент локально живёт на другом порту, то есть на другом origin,
      # и ходит в API прямо из браузера — без CORS браузер не отдаст ему ответ.
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:${CLIENT_HOST_PORT:-3000}}
      # Ошибка почты обрабатывается при отправке и не блокирует остальные функции.
      MANAGEMENT_HEALTH_MAIL_ENABLED: "false"
      TZ: UTC
    ports:
      - "${BACKEND_HOST_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_started
      mailpit:
        condition: service_started

  client:
    build:
      context: ../client
      args:
        # Next.js запекает адрес API в бандл при сборке, а запросы к нему идут
        # из браузера — поэтому адрес хостовый, а не имя сервиса app.
        NEXT_PUBLIC_API_BASE_URL: http://localhost:${BACKEND_HOST_PORT:-8080}
    environment:
      TZ: UTC
    ports:
      - "${CLIENT_HOST_PORT:-3000}:3000"
    depends_on:
      app:
        condition: service_started

  # Синтетические данные для локальной разработки: `docker compose run --rm seed`.
  # Профиль не даёт `up` запускать сид вместе с окружением — только явной командой.
  seed:
    image: postgres:17-alpine
    profiles: ["seed"]
    environment:
      PGHOST: postgres
      PGPORT: "5432"
      PGDATABASE: ${POSTGRES_DB:?POSTGRES_DB is required}
      PGUSER: ${POSTGRES_USER:?POSTGRES_USER is required}
      PGPASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      # Без :? — иначе .env без этой переменной ломал бы и обычный `up`.
      # Пустое значение останавливает сам сид с понятной ошибкой.
      SEED_USER_PASSWORD: ${SEED_USER_PASSWORD:-}
    volumes:
      - ./seed:/seed:ro
    entrypoint:
      - sh
      - -c
      - psql --no-psqlrc --single-transaction -v ON_ERROR_STOP=1 -v seed_user_password="$$SEED_USER_PASSWORD" -f /seed/local-seed.psql
    depends_on:
      postgres:
        condition: service_healthy

  migration-tools:
    image: maven:3.9.11-eclipse-temurin-21
    profiles: ["tools"]
    working_dir: /workspace
    volumes:
      - .:/workspace
      - maven_cache:/root/.m2
    environment:
      DB_URL: ${DB_URL:?DB_URL is required}
      DB_USERNAME: ${DB_USERNAME:?DB_USERNAME is required}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
  rabbitmq_data:
  minio_data:
  maven_cache:
