          nullable: true
          enum: [SOLE_PROPRIETOR_GROUP_3_NON_VAT, SOLE_PROPRIETOR_GROUP_3_VAT, COMPANY_NON_VAT, COMPANY_VAT, INDIVIDUAL]
        constructionTermDays: {type: integer, format: int32, nullable: true, minimum: 0, maximum: 2147483647}
        contractDurationYears: {type: number, nullable: true, minimum: 0, maximum: 999.99, multipleOf: 0.01}
    Area:
      type: number
      nullable: true
      minimum: 0
      exclusiveMinimum: true
      maximum: 999999999999.99
      multipleOf: 0.01
    Entrance:
      type: object
      additionalProperties: false
      required: [longitude, latitude]
      properties:
        longitude: {type: number, minimum: -180, maximum: 180, multipleOf: 0.0000001}
        latitude: {type: number, minimum: -90, maximum: 90, multipleOf: 0.0000001}
      description: 'WGS84. Точка дополнительно проверяется по границе Украины.'
    Contact:
      type: object
      nullable: true
      additionalProperties: false
      required: [name, role]
      anyOf:
        - required: [phone]
          properties:
            phone: {type: string, nullable: false, minLength: 1}
        - required: [email]
          properties:
            email: {type: string, nullable: false, minLength: 1}
      properties:
        name: {type: string, minLength: 1, maxLength: 200}
        role: {type: string, minLength: 1, maxLength: 100}
        phone:
          type: string
          nullable: true
          description: 'E.164. Пробелы, скобки и дефисы удаляются перед проверкой.'
          maxLength: 64
        email: {type: string, format: email, maxLength: 254, nullable: true}
    CreatedObject:
      type: object
      required: [id, name, regionId, managerId, status, statusName, entrance, authorId, createdAt, version, googleMapsUrl]
      properties:
        id: {type: string, format: uuid}
        name: {type: string, minLength: 1, maxLength: 500}
        objectType: {type: string, nullable: true}
        dataSourceId: {type: string, format: uuid, nullable: true}
        shortComment: {type: string, nullable: true, maxLength: 200}
        address: {type: string, nullable: true}
        regionId: {type: string, format: uuid}
        managerId: {type: string, format: uuid}
        status: {type: string, example: FOUND}
        statusName: {type: string, example: Знайдено}
        entrance: {$ref: '#/components/schemas/Entrance'}
        objectArea: {$ref: '#/components/schemas/Area'}
        landArea: {$ref: '#/components/schemas/Area'}
        contact: {$ref: '#/components/schemas/Contact'}
        contactId:
          type: string
          format: uuid
          nullable: true
          description: 'ID нового или выбранного контакта. Для ссылки контактные данные не возвращаются; contact=null. При повторе ID остаётся прежним.'
        authorId: {type: string, format: uuid}
        createdAt: {type: string, format: date-time}
        version: {type: integer, format: int64}
        googleMapsUrl: {type: string, format: uri, readOnly: true, maxLength: 2048, example: 'https://www.google.com/maps/search/?api=1&query=50.4501%2C30.5234'}
        technicalSpecifications: {$ref: '#/components/schemas/TechnicalSpecifications'}
        commercialTerms: {$ref: '#/components/schemas/CommercialTerms'}
    ApiError:
      type: object
      properties:
        timestamp: {type: string, format: date-time}
        status: {type: integer}
        error: {type: string}
        code: {type: string}
        message: {type: string}
        path: {type: string}
        correlationId: {type: string}
        violations:
          type: array
          items:
            type: object
            properties:
              field: {type: string}
              message: {type: string}
    DuplicateWarning:
      allOf:
        - {$ref: '#/components/schemas/ApiError'}
        - type: object
          required: [duplicates]
          properties:
            code: {type: string, enum: [DUPLICATES_FOUND]}
            duplicates:
              type: object
              required: [total, items]
              properties:
                total: {type: integer, format: int64, minimum: 1}
                items:
                  type: array
                  maxItems: 20
                  items:
                    oneOf:
                      - {$ref: '#/components/schemas/AccessibleDuplicate'}
                      - {$ref: '#/components/schemas/RestrictedDuplicate'}
    AccessibleDuplicate:
      type: object
      additionalProperties: false
      required: [id, name, address, status, statusName, refused, distanceMetres, restricted]
      properties:
        id: {type: string, format: uuid}
        name: {type: string, nullable: true}
        address: {type: string, nullable: true}
        status: {type: string}
        statusName: {type: string}
        refused: {type: boolean}
        distanceMetres: {type: number, format: double, minimum: 0}
        restricted: {type: boolean, enum: [false]}
    RestrictedDuplicate:
      type: object
      additionalProperties: false
      required: [name, distanceMetres, restricted]
      properties:
        name: {type: string, nullable: true}
        distanceMetres: {type: number, format: double, minimum: 0}
        restricted: {type: boolean, enum: [true]}
