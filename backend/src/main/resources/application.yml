spring:
  application:
    name: workflow-crm-backend
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 21MB
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      password: ${REDIS_PASSWORD}
      repositories:
        enabled: false
  rabbitmq:
    publisher-confirm-type: correlated
    publisher-returns: true
    host: ${RABBITMQ_HOST}
    port: ${RABBITMQ_PORT}
    username: ${RABBITMQ_USERNAME}
    password: ${RABBITMQ_PASSWORD}
  mail:
    host: ${SMTP_HOST:}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail.smtp.auth: ${SMTP_AUTH:true}
      mail.smtp.starttls.enable: ${SMTP_STARTTLS_ENABLED:true}
      mail.smtp.starttls.required: ${SMTP_STARTTLS_ENABLED:true}
      mail.smtp.ssl.enable: ${SMTP_SSL_ENABLED:false}
      mail.smtp.ssl.checkserveridentity: true
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000

app:
  tasks:
    generation:
      worker-enabled: ${TASK_SET_WORKER_ENABLED:true}
      poll-delay-ms: ${TASK_SET_POLL_DELAY_MS:500}
  objects:
    export:
      worker-enabled: ${OBJECT_EXPORT_WORKER_ENABLED:true}
      poll-delay-ms: ${OBJECT_EXPORT_POLL_DELAY_MS:1000}
      bucket: ${OBJECT_EXPORT_BUCKET:workflow-exports}
      retention: ${OBJECT_EXPORT_RETENTION:24h}
      link-ttl: ${OBJECT_EXPORT_LINK_TTL:5m}
      max-file-bytes: ${OBJECT_EXPORT_MAX_FILE_BYTES:268435456}
    deletion:
      worker-enabled: ${OBJECT_DELETION_WORKER_ENABLED:true}
      poll-delay-ms: ${OBJECT_DELETION_POLL_DELAY_MS:5000}
    list:
      cursor-secret: ${OBJECT_LIST_CURSOR_SECRET:${app.security.jwt.secret}}
    duplicates:
      radius-metres: ${OBJECT_DUPLICATE_RADIUS_METRES:50}
      name-similarity: ${OBJECT_DUPLICATE_NAME_SIMILARITY:0.6}
  integrations:
    # live — настоящие внешние сервисы (только prod), mock — заглушки для dev и stage.
    # Сейчас переключает геокодер; почту на dev и stage перехватывает Mailpit через SMTP_*.
    mode: ${EXTERNAL_INTEGRATIONS_MODE:live}
  geocoding:
    search-url: ${GEOCODING_SEARCH_URL:}
    url: ${GEOCODING_URL:}
    user-agent: ${GEOCODING_USER_AGENT:WorkflowCRM/0.1 (https://github.com/DrBarga/workflow-crm)}
  dev:
    test-user:
      email: ${SEED_TEST_USER_EMAIL:}
      password: ${SEED_TEST_USER_PASSWORD:}
  users:
    region-required-roles: ${USER_REGION_REQUIRED_ROLES:MANAGER,REGIONAL_MANAGER,CONTRACT_MANAGER}
    invitation-ttl: ${USER_INVITATION_TTL:72h}
    invitation-url: ${USER_INVITATION_URL:}
    mail-from: ${USER_INVITATION_MAIL_FROM:${AUTH_EMAIL_FROM:}}
  minio:
    endpoint: ${MINIO_ENDPOINT}
    access-key: ${MINIO_ACCESS_KEY}
    secret-key: ${MINIO_SECRET_KEY}
    public-endpoint: ${MINIO_PUBLIC_ENDPOINT:}
    region: ${MINIO_REGION:us-east-1}
  files:
    bucket: ${FILE_BUCKET:workflow-files}
    task-bucket: ${TASK_FILE_BUCKET:workflow-task-files}
    max-size-bytes: ${FILE_MAX_SIZE_BYTES:20971520}
    allowed-extensions: ${FILE_ALLOWED_EXTENSIONS:jpg,png,heic,pdf,docx,xlsx,dwg}
    link-ttl: ${FILE_LINK_TTL:5m}
    cleanup-enabled: ${FILE_UPLOAD_CLEANUP_ENABLED:true}
  security:
    jwt:
      secret: ${JWT_SECRET}
      issuer: ${JWT_ISSUER:workflow-crm}
      cookie-name: ${JWT_COOKIE_NAME:workflow_access_token}
      access-token-ttl: ${JWT_ACCESS_TOKEN_TTL:15m}
      refresh-cookie-name: ${JWT_REFRESH_COOKIE_NAME:workflow_refresh_token}
      refresh-token-ttl: ${JWT_REFRESH_TOKEN_TTL:7d}
      secure: ${JWT_COOKIE_SECURE:true}
    refresh-session:
      absolute-ttl: ${REFRESH_SESSION_ABSOLUTE_TTL:30d}
      grace-period: ${REFRESH_REUSE_GRACE_PERIOD:30s}
    login:
      max-attempts: ${LOGIN_MAX_ATTEMPTS:5}
      lock-duration: ${LOGIN_LOCK_DURATION:15m}
    administration:
      max-actions: ${ADMIN_SECURITY_MAX_ACTIONS:10}
      rate-window: ${ADMIN_SECURITY_RATE_WINDOW:1m}
    device:
      trust-duration: ${DEVICE_TRUST_DURATION:30d}
      confirmation-mode: ${DEVICE_CONFIRMATION_MODE:NEW_DEVICE}
      cookie-name: ${DEVICE_COOKIE_NAME:workflow_device}
    challenge:
      ttl: ${AUTH_CHALLENGE_TTL:5m}
      max-email-attempts: ${AUTH_EMAIL_CODE_MAX_ATTEMPTS:5}
    telegram:
      bot-username: ${TELEGRAM_BOT_USERNAME:}
      bot-token: ${TELEGRAM_BOT_TOKEN:}
      webhook-secret: ${TELEGRAM_WEBHOOK_SECRET:}
    email:
      from: ${AUTH_EMAIL_FROM:}
    cors:
      # Адреса клиента через запятую, например http://localhost:3000.
      # Пусто — CORS выключен: так и должно быть, где клиент и API на одном origin.
      allowed-origins: ${CORS_ALLOWED_ORIGINS:}
      allowed-methods: GET,POST,PUT,PATCH,DELETE,OPTIONS
      # Всё, что клиент шлёт сверх стандартных заголовков: тело JSON, CSRF-токен, id корреляции
      allowed-headers: Content-Type,Accept,X-XSRF-TOKEN,X-Correlation-Id,Idempotency-Key
      # Браузер не повторяет preflight час — меньше лишних OPTIONS на каждый запрос
      preflight-cache-duration: 1h
    password-recovery:
      token-ttl: ${PASSWORD_RESET_TTL:30m}
      reset-url: ${PASSWORD_RESET_URL:}
      mail-from: ${PASSWORD_RESET_MAIL_FROM:${AUTH_EMAIL_FROM:}}

logging:
  level:
    # Уровень задаёт среда, а не профиль: в коде нет значений, привязанных к среде
    dev.workflowcrm: ${LOG_LEVEL:INFO}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db,rabbit,redis,minio
  health:
    rabbit:
      enabled: true
    redis:
      enabled: true
