databaseChangeLog:
  - changeSet:
      id: 20260930-password-setup-events
      author: bohdan
      changes:
        - sql:
            sql: |
              CREATE TABLE password_setup_events (
                  id UUID PRIMARY KEY,
                  user_id UUID NOT NULL,
                  device_id VARCHAR(64) NOT NULL,
                  action VARCHAR(32) NOT NULL CHECK (action IN ('INITIAL_PASSWORD_SET', 'INVITATION_DEVICE_TRUSTED')),
                  created_at TIMESTAMPTZ NOT NULL DEFAULT CURRENT_TIMESTAMP
              );
              CREATE INDEX password_setup_events_user_idx ON password_setup_events (user_id, created_at);
      rollback:
        - dropTable:
            tableName: password_setup_events
