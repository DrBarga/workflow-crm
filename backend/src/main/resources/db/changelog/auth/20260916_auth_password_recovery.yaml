databaseChangeLog:
  - changeSet:
      id: 20260916_auth_password_recovery
      author: bohdan
      changes:
        - createTable:
            tableName: password_reset_tokens
            columns:
              - column:
                  name: id
                  type: uuid
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: user_id
                  type: uuid
                  constraints:
                    nullable: false
              - column:
                  name: token_hash
                  type: char(64)
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: expires_at
                  type: timestamptz
                  constraints:
                    nullable: false
              - column:
                  name: consumed_at
                  type: timestamptz
              - column:
                  name: invalidated_at
                  type: timestamptz
              - column:
                  name: created_at
                  type: timestamptz
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
        - addForeignKeyConstraint:
            baseTableName: password_reset_tokens
            baseColumnNames: user_id
            referencedTableName: users
            referencedColumnNames: id
            constraintName: fk_password_reset_tokens_user
            onDelete: CASCADE
        - createIndex:
            tableName: password_reset_tokens
            indexName: ix_password_reset_tokens_user_expiry
            columns:
              - column:
                  name: user_id
              - column:
                  name: expires_at
      rollback:
        - dropTable:
            tableName: password_reset_tokens
