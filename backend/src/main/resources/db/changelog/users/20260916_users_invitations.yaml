databaseChangeLog:
  - changeSet:
      id: 20260916_users_invitations
      author: bohdan
      changes:
        - addColumn:
            tableName: users
            columns:
              - column:
                  name: password_setup_required
                  type: boolean
                  defaultValueBoolean: false
                  constraints:
                    nullable: false
        - createTable:
            tableName: user_invitations
            columns:
              - column:
                  name: id
                  type: uuid
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: user_id
                  type: uuid
                  constraints:
                    nullable: false
              - column:
                  name: token_hash
                  type: char(64)
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: expires_at
                  type: timestamptz
                  constraints:
                    nullable: false
              - column:
                  name: consumed_at
                  type: timestamptz
              - column:
                  name: invalidated_at
                  type: timestamptz
              - column:
                  name: created_at
                  type: timestamptz
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
        - addForeignKeyConstraint:
            baseTableName: user_invitations
            baseColumnNames: user_id
            referencedTableName: users
            referencedColumnNames: id
            constraintName: fk_user_invitations_user
            onDelete: CASCADE
        - createIndex:
            tableName: user_invitations
            indexName: ix_user_invitations_user_active
            columns:
              - column:
                  name: user_id
              - column:
                  name: expires_at
      rollback:
        - dropTable:
            tableName: user_invitations
        - dropColumn:
            tableName: users
            columnName: password_setup_required
